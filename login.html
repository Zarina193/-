
<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жүйеге кіру — MedBook</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            margin: 0;
            color: #234;
        }
        header {
            background: #087e8b;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }
        .form-box {
            background: white;
            max-width: 380px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0001;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            color: white;
            background: #087e8b;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #message {
            color: #087e8b;
        }
    </style>
</head>
<body>
    <header>
        <h1>MedBook</h1>
        <nav>
            <a href="index.html">Басты бет</a>
            <a href="doctors.html">Дәрігерлер</a>
        </nav>
    </header>

    <main class="form-box">
        <h2>Жүйеге кіру</h2>

        <form id="loginForm">
            <label for="email">Электрондық пошта:</label>
            <input type="email" id="email"
                   placeholder="example@mail.com" required>

            <label for="password">Құпиясөз:</label>
            <input type="password" id="password"
                   placeholder="Құпиясөзді енгізіңіз"
                   minlength="6" required>

            <button type="submit">Кіру</button>
        </form>

        <p id="message" aria-live="polite"></p>
        <p><a href="index.html">Басты бетке оралу</a></p>
    </main>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                document.getElementById("message").textContent =
                    "Форма тексерілді. Нақты кіру үшін сервер қажет.";
            });
    </script>
</body>
</html>
